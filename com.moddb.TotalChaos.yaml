app-id: com.moddb.TotalChaos
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: totalchaos.sh
finish-args:
  - --device=all
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Audio
  - --socket=pulseaudio
cleanup:
  - /include
  - /lib/*.a
  - /lib/*.la
  - /lib*/cmake
  - /lib*/pkgconfig
  - /lib*/source
  - /lib*/debug
  - /share/doc
  - /share/man
  - /share/help
modules:
  - shared-modules/linux-audio/libinstpatch.json
  - shared-modules/linux-audio/fluidsynth2.json

  - name: game-music-emu
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://github.com/libgme/game-music-emu/archive/refs/tags/0.6.5.tar.gz
        sha256: 8531678502451c2cf04248cda45c8b4645e19fcfb63e6a7ec2549641c47bb392
        x-checker-data:
          type: anitya
          project-id: 866
          stable-only: true
          url-template: https://github.com/libgme/game-music-emu/archive/refs/tags/$version.tar.gz

  - name: zmusic
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://github.com/UZDoom/ZMusic/archive/1.3.0.tar.gz
        sha256: 2eccd41e1cc9b38b3729ab94d65635719b2adc916de4ca9f8399ebceaee89f7f
        x-checker-data:
          type: anitya
          project-id: 153600
          stable-only: true
          url-template: https://github.com/UZDoom/ZMusic/archive/$version.tar.gz

  - name: uzdoom
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_CXX_FLAGS=-DSHARE_DIR=\"/app/share\"
    sources:
      - type: git
        url: https://github.com/UZDoom/UZDoom
        tag: 5.0.0
        commit: 292cf4203ebd3ced951cb67f6819180f588c1d44
        x-checker-data:
          type: json
          url: https://api.github.com/repos/UZDoom/UZDoom/releases/latest
          tag-query: .tag_name

  - name: freedoom2
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/freedoom/freedoom/releases/download/v0.12.1/freedoom-0.12.1.zip
        sha256: f42c6810fc89b0282de1466c2c9c7c9818031a8d556256a6db1b69f6a77b5806
    build-commands:
      - install -Dm 644 freedoom2.wad -t /app/share/games/uzdoom

  - name: totalchaos
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/mbugni/totalchaos-gamedata/releases/download/v1.40.0/totalchaos-gamedata.tgz
        sha256: d550535076a6ed012e74866ec91a5d70989aa29fd01b8b329a25702409c3146c
      - type: file
        path: com.moddb.TotalChaos.appdata.xml
      - type: file
        path: com.moddb.TotalChaos.desktop
      - type: file
        path: com.moddb.TotalChaos.png
      - type: file
        path: totalchaos.sh
    build-commands:
      - install -Dm 644 totalchaos.pk3 -t /app/share/games/uzdoom
      - install -Dm 644 zd_extra.pk3 -t /app/share/games/uzdoom
      - install -Dm 644 gzdoom_portable.ini -t /app/share/games/uzdoom
      - install -Dm 644 ${FLATPAK_ID}.appdata.xml -t /app/share/appdata
      - install -Dm 644 ${FLATPAK_ID}.desktop -t /app/share/applications
      - install -Dm 644 ${FLATPAK_ID}.png -t /app/share/icons/hicolor/128x128/apps
      - install -Dm 755 totalchaos.sh -t /app/bin
